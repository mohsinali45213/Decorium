<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuTrigger = document.getElementById('menu-trigger');
            const closeTrigger = document.getElementById('close-menu');
            const fullMenu = document.getElementById('full-menu');

            const toggleMenu = () => {
                fullMenu.classList.toggle('is-open');
                
                // Toggle pointer events to prevent clicking things behind the menu
                if (fullMenu.classList.contains('is-open')) {
                    fullMenu.classList.remove('pointer-events-none');
                    document.body.style.overflow = 'hidden'; // Prevent background scrolling
                } else {
                    // Delay adding pointer-events-none until animation finishes
                    setTimeout(() => {
                        fullMenu.classList.add('pointer-events-none');
                        document.body.style.overflow = '';
                    }, 1200); 
                }
            };

            menuTrigger.addEventListener('click', toggleMenu);
            closeTrigger.addEventListener('click', toggleMenu);
        });
    </script>
