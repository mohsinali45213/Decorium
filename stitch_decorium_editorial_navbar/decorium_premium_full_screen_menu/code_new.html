<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuTrigger = document.getElementById('menu-trigger');
            const closeTrigger = document.getElementById('close-menu');
            const fullMenu = document.getElementById('full-menu');

            const toggleMenu = () => {
                fullMenu.classList.toggle('is-open');
                
                // Toggle pointer events to prevent clicking things behind the menu
                if (fullMenu.classList.contains('is-open')) {
                    fullMenu.classList.remove('pointer-events-none');
                    document.body.style.overflow = 'hidden'; // Prevent background scrolling
                } else {
                    // Delay adding pointer-events-none until animation finishes
                    setTimeout(() => {
                        fullMenu.classList.add('pointer-events-none');
                        document.body.style.overflow = '';
                    }, 1200); 
                }
            };

            menuTrigger.addEventListener('click', toggleMenu);
            closeTrigger.addEventListener('click', toggleMenu);
            
            // Hover logic for menu items
            const navLinks = document.querySelectorAll('nav .stagger-item[data-image]');
            const previewImages = document.querySelectorAll('.preview-img');
            const categoriesPreview = document.getElementById('categories-preview');

            navLinks.forEach(link => {
                link.addEventListener('mouseenter', () => {
                    const target = link.getAttribute('data-image');
                    
                    // Hide all images
                    previewImages.forEach(img => {
                        img.classList.remove('opacity-100');
                        img.classList.add('opacity-0');
                    });
                    
                    // Hide categories
                    categoriesPreview.classList.add('opacity-0', 'pointer-events-none');
                    categoriesPreview.classList.remove('opacity-100');

                    if (target === 'categories') {
                        categoriesPreview.classList.remove('opacity-0', 'pointer-events-none');
                        categoriesPreview.classList.add('opacity-100');
                    } else {
                        const targetImg = document.getElementById(`preview-${target}`);
                        if (targetImg) {
                            targetImg.classList.remove('opacity-0');
                            targetImg.classList.add('opacity-100');
                        }
                    }
                });
            });
        });
    </script>
